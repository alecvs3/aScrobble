name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            rust_targets: x86_64-unknown-linux-gnu
            label: linux

          - os: windows-latest
            target: x86_64-pc-windows-msvc
            rust_targets: x86_64-pc-windows-msvc
            label: windows

          - os: macos-latest
            target: universal-apple-darwin
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            label: macos

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      # ── Node setup & cache ────────────────────────────────────────────────
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      # ── Rust setup & cache ────────────────────────────────────────────────
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Cache Rust build artefacts
        uses: Swatinem/rust-cache@v2
        with:
          workdir: src-tauri

      # ── Linux system dependencies ─────────────────────────────────────────
      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            libglib2.0-dev \
            libssl-dev

      # ── Frontend & worker ─────────────────────────────────────────────────
      - name: Install frontend dependencies
        run: npm ci

      - name: Build Cloudflare Worker bundle
        run: npm run build:worker

      # ── Tauri build + release ─────────────────────────────────────────────
      - name: Build and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'aScrobble ${{ github.ref_name }}'
          releaseBody: |
            ## What's new in v1.1.4

            ### 📚 Songs played from your library are scrobbled
            Apple Music keeps plays from your library in a separate list, and the worker only read the catalog list. Every song you played from your library was skipped. The worker now reads both lists. Switching over doesn't re-scrobble anything you've already heard.

            ### 🛟 Outage recovery
            If the worker can't reach Apple Music for a while (an expired token, an outage), it finds where your saved history picks up again and backfills the plays it missed, with estimated timestamps. This works for gaps under 13 days, since Last.fm doesn't accept plays older than 14 days. The dashboard shows how recovery is going.

            ### 🔁 No more lost scrobbles when Last.fm hiccups
            Plays Last.fm doesn't confirm are queued with their original timestamps and resent on the next poll, instead of being dropped.

            ### 🔐 Safer worker connection
            The app now sends the worker's access key in a header instead of the URL, and manual polls, stats resets and status checks all go through the app. Apple token rotation goes through the worker first, so it also clears any cooldown and keeps the recovery checkpoint.

            ### 🧰 Other fixes
            - Removed the library play-count check. Apple rejects it, so it never worked and cost one extra request per poll.
            - Changing the polling interval now reports an error if Cloudflare rejects it, instead of silently keeping the old schedule.
            - Syncing the worker repairs its saved credentials when it no longer accepts the app's access key, and reports an error if the worker never confirms it's ready.
            - Apple Music sign-in can't be opened twice, and closing its window cancels cleanly.
            - Saved credentials are written atomically, and errors saving them are reported.
            - New setting to turn off desktop notifications.
            - Apple token expiry now counts the final partial day correctly.
            - Removed a debug command that could copy your Apple tokens.

            ---
            **After updating:** the dashboard asks you to sync your Cloudflare Worker. Click it once so the worker gets these fixes.

            See the assets below to download and install.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: --target ${{ matrix.target }}
