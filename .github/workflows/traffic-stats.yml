name: Traffic & Repo Analytics

on:
  schedule:
    # Run daily at 23:00 UTC
    - cron: '0 23 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: traffic-stats
  cancel-in-progress: false

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch and archive traffic stats & generate HTML report
        uses: jgehrcke/github-repo-stats@v1.4.2
        with:
          ghtoken: ${{ secrets.GHRS_GITHUB_API_TOKEN || secrets.GITHUB_TOKEN }}
          ghpagesprefix: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
      - name: Archive clone context and release asset counts
        run: |
          gh api -H 'Accept: application/vnd.github.raw+json' \
            "repos/${GITHUB_REPOSITORY}/contents/scripts/traffic-attribution.mjs?ref=${GITHUB_SHA}" \
            > "${RUNNER_TEMP}/traffic-attribution.mjs"
          node "${RUNNER_TEMP}/traffic-attribution.mjs"
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TRAFFIC_TOKEN: ${{ secrets.GHRS_GITHUB_API_TOKEN || secrets.GITHUB_TOKEN }}

